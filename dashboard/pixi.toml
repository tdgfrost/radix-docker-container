[workspace]
authors = ["tdgfrost <100413067+tdgfrost@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "radix-dashboard"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[tasks]
dashboard = "uvicorn app:app --host 0.0.0.0 --port 8501"

[dependencies]
python = "==3.11"
nushell = ">=0.116.1,<0.117"
vim = ">=9.2.1054,<10"

[pypi-dependencies]
numpy = ">=2.4.6, <3"
matplotlib = ">=3.11.2, <4"
scipy = ">=1.17.1, <2"
scikit-learn = ">=1.9.1, <2"
pandas = ">=3.0.6, <4"
pyarrow = ">=26.0.0, <27"
shap = ">=0.51.0, <0.52"
starlette = ">=0.40.0, <2"
uvicorn = ">=0.30.0, <1"

[target.linux-64.pypi-dependencies]
xgboost-cpu = ">=3.2.0, <4"

[target.linux-aarch64.pypi-dependencies]
xgboost = ">=3.2.0, <4"

[target.osx-arm64.pypi-dependencies]
xgboost = ">=3.2.0, <4"
